<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>羊了个羊</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <!-- 背景装饰 -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <!-- 顶栏 -->
    <header class="header">
      <div class="header-left">
        <svg class="sheep-logo-small" viewBox="0 0 96 96">
          <g stroke="#2b2118" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="22" cy="52" rx="9" ry="6" fill="#f5d7b0" transform="rotate(-24 22 52)" />
            <ellipse cx="74" cy="52" rx="9" ry="6" fill="#f5d7b0" transform="rotate(24 74 52)" />
            <circle cx="30" cy="30" r="13" fill="#ffffff" />
            <circle cx="48" cy="23" r="14" fill="#ffffff" />
            <circle cx="66" cy="30" r="13" fill="#ffffff" />
            <circle cx="24" cy="44" r="12" fill="#ffffff" />
            <circle cx="72" cy="44" r="12" fill="#ffffff" />
            <ellipse cx="48" cy="54" rx="23" ry="21" fill="#f5d7b0" />
            <circle cx="39" cy="50" r="3.4" fill="#2b2118" stroke="none" />
            <circle cx="57" cy="50" r="3.4" fill="#2b2118" stroke="none" />
            <circle cx="33" cy="59" r="3.6" fill="#fe99d9" stroke="none" opacity="0.85" />
            <circle cx="63" cy="59" r="3.6" fill="#fe99d9" stroke="none" opacity="0.85" />
            <path d="M45 58 Q48 61 51 58" fill="none" stroke-width="3" />
            <path d="M48 61 Q48 66 43 66" fill="none" stroke-width="3" />
            <path d="M48 61 Q48 66 53 66" fill="none" stroke-width="3" />
          </g>
        </svg>
        <h1 class="title">羊了个羊</h1>
      </div>
      <div class="header-right">
        <span class="level-badge" id="levelBadge">第 1 关</span>
        <button class="restart-btn" onclick="game.restart()" title="重新开始">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2b2118" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 游戏区 -->
    <main class="game-area">
      <!-- 剩余计数 -->
      <div class="remaining-badge" id="remainingBadge">剩余 0 张</div>

      <!-- 牌堆 -->
      <div class="board-container" id="boardContainer">
        <div class="board-dots"></div>
        <div class="board-tiles" id="boardTiles"></div>
      </div>

      <!-- 移出区 + 槽位 -->
      <div class="tray-area" id="trayArea">
        <div class="parked-row" id="parkedRow"></div>
        <div class="tray-container" id="trayContainer">
          <div class="tray-slots" id="traySlots"></div>
          <div class="burst-effect" id="burstEffect"></div>
        </div>
      </div>

      <!-- 道具栏 -->
      <div class="prop-bar">
        <button class="prop-btn prop-undo" id="btnUndo" onclick="game.useUndo()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2b2118" stroke-width="2.8">
            <path d="M3 7v6h6" />
            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" />
          </svg>
          撤回
          <span class="prop-count" id="countUndo">1</span>
        </button>
        <button class="prop-btn prop-out" id="btnOut" onclick="game.useMoveOut()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2b2118" stroke-width="2.8">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16,17 21,12 16,7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          移出
          <span class="prop-count" id="countOut">1</span>
        </button>
        <button class="prop-btn prop-shuffle" id="btnShuffle" onclick="game.useShuffle()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2b2118" stroke-width="2.8">
            <path d="M16 3h5v5" />
            <path d="M4 20L21 3" />
            <path d="M21 16v5h-5" />
            <path d="M15 15l6 6" />
            <path d="M4 4l5 5" />
          </svg>
          洗牌
          <span class="prop-count" id="countShuffle">1</span>
        </button>
      </div>
    </main>

    <!-- 弹窗遮罩 -->
    <div class="overlay" id="overlay">
      <div class="modal" id="modal"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>

</html>
