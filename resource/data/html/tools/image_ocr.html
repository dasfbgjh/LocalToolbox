<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片OCR识别</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./image_ocr.css">
</head>

<body>
    <div class="tool-page" data-no-header>
        <div class="tool-card ocr-layout">
            <div id="banner"></div>

            <div class="ocr-left-panel">
                <button type="button" class="btn btn-primary ocr-start-btn" id="btn-ocr" disabled>
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="15" height="15"
                        style="margin-right:6px;vertical-align:-3px;">
                        <path
                            d="M4 7C4 5.89543 4.89543 5 6 5H18C19.1046 5 20 5.89543 20 7V17C20 18.1046 19.1046 19 18 19H6C4.89543 19 4 18.1046 4 17V7Z"
                            stroke="currentColor" stroke-width="2" />
                        <path d="M8 10H16M8 14H14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <span id="btn-ocr-text">开始识别</span>
                </button>

                <div class="ocr-param-group">
                    <label class="ocr-param-label">识别模式</label>
                    <select id="param-mode" class="select ocr-param-select">
                        <option value="doc">文档识别</option>
                        <option value="table">表格识别</option>
                        <option value="plate">车牌识别</option>
                    </select>
                </div>

                <fieldset class="ocr-fieldset" id="fs-text">
                    <legend class="ocr-legend">文本识别</legend>
                    <div class="ocr-param-group">
                        <label class="ocr-param-label">识别模型</label>
                        <select id="param-model" class="select ocr-param-select">
                            <option value="">加载中…</option>
                        </select>
                    </div>
                    <div class="ocr-param-group">
                        <label class="ocr-param-label">角度检测方式</label>
                        <select id="param-cls-mode" class="select ocr-param-select">
                            <option value="">加载中…</option>
                        </select>
                    </div>
                    <div class="ocr-param-group">
                        <label class="ocr-param-label">角度检测模型</label>
                        <select id="param-cls-model" class="select ocr-param-select">
                            <option value="">加载中…</option>
                        </select>
                    </div>

                    <div class="ocr-param-row">
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">最大边长</label>
                            <input type="number" id="param-maxSideLen" value="960" min="32" max="4096" step="32"
                                class="ocr-param-number">
                        </div>
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">缩放限制</label>
                            <select id="param-limitType" class="select ocr-param-select">
                                <option value="max">最长边</option>
                                <option value="min">最短边</option>
                            </select>
                        </div>
                    </div>

                    <div class="ocr-param-group">
                        <label class="ocr-param-label">检测阈值 <span id="param-boxScoreThresh-val"
                                class="ocr-param-val">0.30</span></label>
                        <input type="range" id="param-boxScoreThresh" min="0.1" max="0.9" step="0.05" value="0.3">
                    </div>

                    <div class="ocr-param-row">
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">框置信度 <span id="param-boxThresh-val"
                                    class="ocr-param-val">0.60</span></label>
                            <input type="range" id="param-boxThresh" min="0.1" max="0.9" step="0.05" value="0.6">
                        </div>
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">扩展比例 <span id="param-unClipRatio-val"
                                    class="ocr-param-val">1.50</span></label>
                            <input type="range" id="param-unClipRatio" min="0.5" max="4.0" step="0.1" value="1.5">
                        </div>
                    </div>

                    <div class="ocr-param-row">
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">形态学膨胀</label>
                            <select id="param-dilation" class="select ocr-param-select">
                                <option value="0">禁用</option>
                                <option value="1">启用</option>
                            </select>
                        </div>
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">置信度模式</label>
                            <select id="param-scoreMode" class="select ocr-param-select">
                                <option value="fast">快速</option>
                                <option value="slow">平均</option>
                            </select>
                        </div>
                    </div>

                    <div class="ocr-param-row">
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">输出框类型</label>
                            <select id="param-boxType" class="select ocr-param-select">
                                <option value="quad">四边形</option>
                                <option value="poly">多边形</option>
                            </select>
                        </div>
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">包含空格</label>
                            <select id="param-spaceChar" class="select ocr-param-select">
                                <option value="1">启用</option>
                                <option value="0">禁用</option>
                            </select>
                        </div>
                    </div>

                    <div class="ocr-param-row">
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">识别批处理</label>
                            <input type="number" id="param-recBatchNum" value="6" min="1" max="32" step="1"
                                class="ocr-param-number">
                        </div>
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">识别过滤 <span id="param-dropScore-val"
                                    class="ocr-param-val">0.50</span></label>
                            <input type="range" id="param-dropScore" min="0.1" max="0.9" step="0.05" value="0.5">
                        </div>
                    </div>

                    <div class="ocr-param-row">
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">分类批处理</label>
                            <input type="number" id="param-clsBatchNum" value="6" min="1" max="32" step="1"
                                class="ocr-param-number">
                        </div>
                        <div class="ocr-param-group">
                            <label class="ocr-param-label">分类阈值 <span id="param-clsThresh-val"
                                    class="ocr-param-val">0.90</span></label>
                            <input type="range" id="param-clsThresh" min="0.1" max="0.99" step="0.01" value="0.9">
                        </div>
                    </div>
                </fieldset>

                <fieldset class="ocr-fieldset" id="fs-layout">
                    <legend class="ocr-legend">文档结构识别</legend>
                    <div class="ocr-param-group">
                        <label class="ocr-param-label">版面算法</label>
                        <select id="param-layout-algo" class="select ocr-param-select">
                            <option value="">加载中…</option>
                        </select>
                    </div>
                    <div class="ocr-param-group">
                        <label class="ocr-param-label">版面模型</label>
                        <select id="param-layout" class="select ocr-param-select">
                            <option value="">加载中…</option>
                        </select>
                    </div>
                </fieldset>

                <fieldset class="ocr-fieldset" id="fs-table">
                    <legend class="ocr-legend">表格识别</legend>
                    <div class="ocr-param-group">
                        <label class="ocr-param-label">表格类型</label>
                        <select id="param-table-algo" class="select ocr-param-select">
                            <option value="wireless">无线表格</option>
                            <option value="wired">有线表格</option>
                            <option value="combined">自动识别</option>
                        </select>
                    </div>
                    <div class="ocr-param-group" id="table-wireless-group" style="display:none;">
                        <label class="ocr-param-label">无线模型</label>
                        <select id="param-table-wireless" class="select ocr-param-select">
                            <option value="">加载中…</option>
                        </select>
                    </div>
                    <div class="ocr-param-group" id="table-wired-group" style="display:none;">
                        <label class="ocr-param-label">有线模型</label>
                        <select id="param-table-wired" class="select ocr-param-select">
                            <option value="">加载中…</option>
                        </select>
                    </div>
                    <div class="ocr-param-group" id="table-cls-group" style="display:none;">
                        <label class="ocr-param-label">检测模型</label>
                        <select id="param-table-cls" class="select ocr-param-select">
                            <option value="">加载中…</option>
                        </select>
                    </div>
                </fieldset>

                <fieldset class="ocr-fieldset" id="fs-plate">
                    <legend class="ocr-legend">车牌识别</legend>
                    <div class="ocr-param-group">
                        <label class="ocr-param-label">车牌模型</label>
                        <select id="param-plate-model" class="select ocr-param-select">
                            <option value="">加载中…</option>
                        </select>
                    </div>
                </fieldset>
            </div>

            <div class="ocr-right-panel">
                <div class="ocr-image-section">
                    <div class="ocr-image-row">
                        <div class="ocr-image-main">
                            <div class="upload-preview ocr-upload" id="drop-zone">
                                <div class="preview-empty" id="preview-empty">
                                    <div class="ocr-drop-icons">
                                        <div class="ocr-drop-icon-ring"></div>
                                        <div class="ocr-drop-icon-inner">
                                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                                                class="ocr-drop-svg">
                                                <path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor"
                                                    stroke-width="2" stroke-linecap="round"
                                                    stroke-linejoin="round" />
                                                <path
                                                    d="M4 16V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V16"
                                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                                    stroke-linejoin="round" />
                                            </svg>
                                        </div>
                                    </div>
                                    <div class="ocr-drop-text">
                                        <span class="ocr-drop-title">拖拽图片到此处 或 点击选择文件</span>
                                        <span class="ocr-drop-sub">选择图片后在图片上点击可显示选区</span>
                                        <span class="ocr-drop-hint">
                                            <span class="ocr-drop-chip">PNG</span>
                                            <span class="ocr-drop-chip">JPG</span>
                                            <span class="ocr-drop-chip">BMP</span>
                                            <span class="ocr-drop-chip">WEBP</span>
                                            <span class="ocr-drop-size">· 最大 20MB</span>
                                        </span>
                                    </div>
                                </div>
                                <div class="preview-image-wrap" id="preview-wrap">
                                    <div class="ocr-img-stage" id="ocr-img-stage">
                                        <img class="ocr-preview-img" id="ocr-preview-img" alt="预览">
                                        <svg class="ocr-box-overlay" id="ocr-box-overlay"
                                            xmlns="http://www.w3.org/2000/svg"
                                            preserveAspectRatio="none"></svg>
                                        <div class="ocr-box-layer" id="ocr-box-layer"></div>
                                        <svg class="ocr-crop-overlay" id="ocr-crop-overlay"
                                            xmlns="http://www.w3.org/2000/svg"
                                            preserveAspectRatio="none">
                                            <defs>
                                                <mask id="ocr-crop-mask">
                                                    <rect class="ocr-crop-mask-bg" x="0" y="0" width="100%"
                                                        height="100%" fill="white" />
                                                    <rect class="ocr-crop-mask-hole" id="ocr-crop-mask-hole"
                                                        fill="black" />
                                                </mask>
                                            </defs>
                                            <rect class="ocr-crop-shadow" x="0" y="0" width="100%" height="100%"
                                                mask="url(#ocr-crop-mask)" />
                                            <rect class="ocr-crop-frame" id="ocr-crop-frame" />
                                            <rect class="ocr-crop-move-area" id="ocr-crop-move-area"
                                                fill="transparent" />
                                            <rect class="ocr-crop-handle" data-handle="nw" />
                                            <rect class="ocr-crop-handle" data-handle="n" />
                                            <rect class="ocr-crop-handle" data-handle="ne" />
                                            <rect class="ocr-crop-handle" data-handle="e" />
                                            <rect class="ocr-crop-handle" data-handle="se" />
                                            <rect class="ocr-crop-handle" data-handle="s" />
                                            <rect class="ocr-crop-handle" data-handle="sw" />
                                            <rect class="ocr-crop-handle" data-handle="w" />
                                        </svg>
                                    </div>
                                </div>
                                <input type="file" id="file-input" accept="image/*">
                            </div>
                        </div>
                        <div class="ocr-image-actions">
                            <button type="button" class="btn btn-sm btn-outline" id="ocr-reupload-btn">更换图片</button>
                            <button type="button" class="btn btn-sm btn-outline" id="btn-reset-crop">重置选区</button>
                            <button type="button" class="btn btn-sm btn-outline" id="btn-clear">清空</button>
                        </div>
                    </div>
                </div>

                <div class="ocr-result-section">
                    <div class="ocr-result-header">
                        <label class="tool-label">识别结果</label>
                        <div class="ocr-result-toolbar" id="ocr-result-toolbar" style="display:none;">
                            <span class="ocr-stats" id="ocr-stats"></span>
                            <span class="spacer"></span>
                            <button class="btn btn-sm" id="btn-copy-text">复制文本</button>
                            <button class="btn btn-sm btn-outline" id="btn-download-text">下载TXT</button>
                        </div>
                    </div>
                    <div class="ocr-result-area" id="result-area">
                        <div class="ocr-result-empty" id="result-empty">
                            <span>上传图片后点击「开始识别」</span>
                        </div>
                        <div class="ocr-loading" id="result-loading" style="display:none;">
                            <div class="ocr-spinner"></div>
                            <span id="result-loading-msg">正在识别，请稍候...</span>
                            <span class="ocr-loading-extra" id="result-loading-extra"></span>
                        </div>
                        <div class="ocr-rich-editor" id="ocr-rich-editor" contenteditable="true" style="display:none;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script src="./image_ocr.js"></script>
</body>

</html>
